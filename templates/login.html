{% extends "base.html" %}
{% block title %}Login — QuizArena{% endblock %}

{% block head %}
<style>
.auth-page {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(108,99,255,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0,255,200,0.10) 0%, transparent 50%),
        var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    background: rgba(13,19,32,0.90);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    animation: cardUp 0.5s ease;
}

@keyframes cardUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

.auth-logo {
    text-align: center;
    margin-bottom: 32px;
}

.auth-logo img {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 3px solid var(--primary);
    margin-bottom: 14px;
}

.auth-logo h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
}

.auth-logo p {
    color: var(--muted);
    font-size: 14px;
}

.auth-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.auth-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 16px 12px 44px;
    transition: all 0.2s;
    outline: none;
}

.auth-input:focus {
    border-color: var(--primary);
    background: rgba(0,255,200,0.04);
    box-shadow: 0 0 0 3px rgba(0,255,200,0.10);
}

.input-wrap {
    position: relative;
    margin-bottom: 20px;
}

.input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 17px;
    pointer-events: none;
}

.eye-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s;
}

.eye-toggle:hover { color: var(--primary); }

.auth-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border: none;
    color: #000;
    font-weight: 700;
    font-size: 16px;
    padding: 13px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
}

.auth-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,200,0.35);
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
}

.auth-footer a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

.auth-footer a:hover { text-decoration: underline; }

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--muted);
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
}
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <h1>QuizArena</h1>
            <p>Welcome back, challenger!</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" autocomplete="off">

            <label class="auth-label">Username</label>
            <div class="input-wrap">
                <i class="bi bi-person-fill input-icon"></i>
                <input type="text" name="username" class="auth-input"
                       placeholder="Enter your username" required autocomplete="username">
            </div>

            <label class="auth-label">Password</label>
            <div class="input-wrap">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" name="password" id="pwdField" class="auth-input"
                       placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="eye-toggle" id="eyeBtn">
                    <i class="bi bi-eye-fill" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="auth-submit">
                <i class="bi bi-lightning-fill"></i> Login to QuizArena
            </button>
        </form>

        <div class="divider">OR</div>

        <div class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free →</a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eyeBtn  = document.getElementById("eyeBtn");
const pwdField = document.getElementById("pwdField");
const eyeIcon  = document.getElementById("eyeIcon");

eyeBtn.addEventListener("click", () => {
    const show = pwdField.type === "password";
    pwdField.type   = show ? "text" : "password";
    eyeIcon.className = show ? "bi bi-eye-slash-fill" : "bi bi-eye-fill";
});
</script>
{% endblock %}
